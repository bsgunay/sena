<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hakkımızda</title>
<meta name="description" content="">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="about">

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">
      <img src="images/logo-header.png" alt="Velora" class="brand-logo">
    </a>
    <nav class="main-nav" aria-label="Ana menü">
      <ul>
        <li><a href="index.html" data-i18n="nav.home">Anasayfa</a></li>
        <li><a href="urunler.html" data-i18n="nav.products">Ürünler</a></li>
        <li><a href="atolye.html" data-i18n="nav.workshop">Atölye</a></li>
        <li><a href="hakkimizda.html" aria-current="page" data-i18n="nav.about">Hakkımızda</a></li>
        <li><a href="iletisim.html" data-i18n="nav.contact">İletişim</a></li>
      </ul>
      <div class="lang-select-wrap">
        <label for="lang-select" data-i18n="nav.lang_label" class="visually-hidden">Dil</label>
        <select id="lang-select" aria-label="Dil seçimi"></select>
      </div>
    </nav>
    <button class="nav-toggle" aria-expanded="false" aria-label="Menüyü aç/kapat">☰</button>
  </div>
</header>

<main>
  <section>
    <div class="wrap">
      <div style="display:grid;grid-template-columns:1.1fr 0.9fr;gap:3rem;align-items:center;">
        <div>
          <p class="eyebrow" data-i18n="nav.about">Hakkımızda</p>
          <h1 data-i18n="about.title">Hakkımızda</h1>
          <div class="about-lede" id="about-paragraphs"></div>
        </div>
        <div class="hero-visual" style="aspect-ratio:4/3;">
          <img src="images/about.svg" alt="">
        </div>
      </div>
    </div>
  </section>

  <div class="fold-divider accent" role="presentation"></div>

  <section class="section-alt">
    <div class="wrap">
      <h2 data-i18n="about.values_title">Neye Önem Veriyoruz</h2>
      <div class="values-grid" id="values-grid"></div>
    </div>
  </section>

  <section class="cta-band">
    <div class="wrap">
      <div>
        <h2 data-i18n="home.cta_title">Bayilik ve İş Birliği İçin</h2>
        <p data-i18n="home.cta_text">Ürünlerimiz hakkında detaylı bilgi...</p>
      </div>
      <a href="iletisim.html" class="btn btn-outline" data-i18n="home.cta_button">İletişime Geç</a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div>
      <p class="footer-brand" data-i18n="brand.name">Velora</p>
      <p data-i18n="footer.tagline">Sineklik ve Plise Perde Sistemleri</p>
    </div>
    <p>&copy; <span id="footer-year"></span> <span data-i18n="brand.name">Velora</span>. <span data-i18n="footer.rights">Tüm hakları saklıdır.</span></p>
  </div>
</footer>

<script src="js/site-config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById("footer-year").textContent = new Date().getFullYear();

  window.renderDynamicContent = function (data) {
    const pEl = document.getElementById("about-paragraphs");
    pEl.innerHTML = "";
    (data.about.intro_paragraphs || []).forEach((t) => {
      const p = document.createElement("p");
      p.textContent = t;
      pEl.appendChild(p);
    });

    const vEl = document.getElementById("values-grid");
    vEl.innerHTML = "";
    (data.about.values || []).forEach((v) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<h3>${v.title}</h3><p>${v.text}</p>`;
      vEl.appendChild(card);
    });
  };
</script>
</body>
</html>
