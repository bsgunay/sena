<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ürünler</title>
<meta name="description" content="">
<link rel="icon" href="images/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">
      <img src="images/logo-header.png" alt="Velora" class="brand-logo">
    </a>
    <nav class="main-nav" aria-label="Ana menü">
      <ul>
        <li><a href="index.html" data-i18n="nav.home">Anasayfa</a></li>
        <li><a href="urunler.html" aria-current="page" data-i18n="nav.products">Ürünler</a></li>
        <li><a href="atolye.html" data-i18n="nav.workshop">Atölye</a></li>
        <li><a href="hakkimizda.html" data-i18n="nav.about">Hakkımızda</a></li>
        <li><a href="iletisim.html" data-i18n="nav.contact">İletişim</a></li>
      </ul>
      <div class="lang-select-wrap">
        <label for="lang-select" data-i18n="nav.lang_label" class="visually-hidden">Dil</label>
        <select id="lang-select" aria-label="Dil seçimi"></select>
      </div>
    </nav>
    <button class="nav-toggle" aria-expanded="false" aria-label="Menüyü aç/kapat">☰</button>
  </div>
</header>

<main>
  <section style="padding-bottom:1rem;">
    <div class="wrap">
      <div class="section-head">
        <p class="eyebrow" data-i18n="nav.products">Ürünler</p>
        <h1 data-i18n="products.title">Ürünler</h1>
        <p data-i18n="products.intro">Tüm ürünlerimiz kendi atölyemizde...</p>
      </div>
    </div>
  </section>

  <div class="fold-divider accent" role="presentation"></div>

  <section>
    <div class="wrap">
      <div class="product-cat">
        <div class="product-cat-title">
          <h2 data-i18n="products.category_plise">Plise Perde Sistemleri</h2>
          <span id="plise-count"></span>
        </div>
        <div class="product-grid" id="plise-grid"></div>
      </div>
    </div>
  </section>

  <section class="cta-band">
    <div class="wrap">
      <div>
        <h2 data-i18n="home.cta_title">Bayilik ve İş Birliği İçin</h2>
        <p data-i18n="home.cta_text">Ürünlerimiz hakkında detaylı bilgi...</p>
      </div>
      <a href="iletisim.html" class="btn btn-outline" data-i18n="home.cta_button">İletişime Geç</a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div>
      <p class="footer-brand" data-i18n="brand.name">Velora</p>
      <p data-i18n="footer.tagline">Plise Perde Sistemleri</p>
    </div>
    <p>&copy; <span id="footer-year"></span> <span data-i18n="brand.name">Velora</span>. <span data-i18n="footer.rights">Tüm hakları saklıdır.</span></p>
  </div>
</footer>

<script src="js/site-config.js"></script>
<script src="js/urun-verisi.js"></script>
<script src="js/urun-katmani.js"></script>
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById("footer-year").textContent = new Date().getFullYear();

  /* Kartlar ÜRETİLMİŞ VERİDEN kuruluyor (window.VELORA_URUNLER).
     Eski sürümde görseller `imageOrder` dizisiyle SIRAYA göre eşleniyordu;
     listeden bir ürün çıkınca kalan her ürün yanlış görsele kayıyordu.
     Artık eşleme model `id`'si üzerinden — sıradan bağımsız. */
  window.renderDynamicContent = function (t) {
    const U = window.VeloraUrun;
    if (!U) return;

    const kap = document.getElementById("plise-grid");
    kap.innerHTML = "";

    const modeller = U.modeller();
    document.getElementById("plise-count").textContent =
      modeller.length + " " + U.ad.ui(t, "model_count", "model");

    for (const m of modeller) {
      const kapak   = U.kapakGorseli(m.id);
      const kumasN  = U.kumaslar(m.id).length;
      const cerceveN = U.veri.cerceveler.length;
      const ad      = U.ad.model(t, m.id);

      const a = document.createElement("a");
      a.className = "product-card product-card-link";
      a.href = "urun.html?model=" + encodeURIComponent(m.id);
      a.innerHTML = `
        <div class="thumb">${kapak ? `<img src="${kapak}" alt="" loading="lazy">` : ""}</div>
        <div class="body">
          <h3></h3>
          <p class="model-ozet"></p>
          <p class="model-sayilar">
            <span class="say"></span>
            <span class="say"></span>
          </p>
          <span class="card-cta"></span>
        </div>`;
      a.querySelector("h3").textContent = ad;
      a.querySelector(".model-ozet").textContent = U.ad.ozet(t, m.id);
      const sayilar = a.querySelectorAll(".say");
      sayilar[0].textContent = kumasN + " " + U.ad.ui(t, "fabric_count", "kumaş");
      sayilar[1].textContent = cerceveN + " " + U.ad.ui(t, "frame_count", "çerçeve rengi");
      a.querySelector(".card-cta").textContent = U.ad.ui(t, "detail_cta", "Seçenekleri gör");
      kap.appendChild(a);
    }
  };
</script>
</body>
</html>
